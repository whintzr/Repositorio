<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141942">
<meta name="description" content="Sistema para organizar documentos por formato, com acesso pelo computador e pelo celular.">
<title>Organizador de Arquivos</title>
<style>
:root{
  --bg:#141942;
  --bg2:#1a2050;
  --bg3:#222a63;
  --line:#2f3878;
  --text:#e9ebf7;
  --muted:#98a0d0;
  --gold:#C9A048;
  --accent:#6f80ff;
  --accent-d:#4d5fe0;
  --danger:#ea7a72;
  --ok:#6cc79a;
  --word:#4f8cff;
  --ppt:#ff8a5c;
  --xls:#4fcf8f;
  --zip:#c9a048;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.app{max-width:1240px;margin:0 auto;padding:22px 24px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:34px;height:34px;flex:0 0 34px}
.brand h1{margin:0;font-size:21px;font-weight:600;letter-spacing:.2px}
.rootinfo{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.rootinfo b{color:var(--text);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--bg2);padding:9px 14px;border-radius:9px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--bg3);border-color:#3f4a95}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent-d);border-color:var(--accent-d);font-weight:600}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn svg{width:16px;height:16px}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{display:flex;align-items:center;gap:10px;padding:12px 18px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;font-weight:600;white-space:nowrap;border-radius:10px 10px 0 0}
.tab:hover{color:var(--text);background:var(--bg2)}
.tab.active{color:var(--text);background:var(--bg2);border-bottom-color:var(--accent)}
.tab .dot{width:10px;height:10px;border-radius:3px}
.tab .count{color:var(--gold);font-weight:700;font-size:13px;background:rgba(201,160,72,.12);padding:1px 8px;border-radius:20px;min-width:24px;text-align:center}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:15px}
.crumbs button{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px;font-weight:600}
.crumbs button:hover{background:var(--bg2);color:var(--text)}
.crumbs button.last{color:var(--text);cursor:default}
.crumbs button.last:hover{background:none}
.crumbs .sep{color:var(--line)}
.crumbs .res{color:var(--muted)}
.crumbs .res b{color:var(--gold)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.filters{display:grid;grid-template-columns:2fr 1.1fr 1fr 1fr auto;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.filters input,.filters select,.modal input,.modal select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);outline:none;width:100%}
.filters input:focus,.filters select:focus,.modal input:focus,.modal select:focus{border-color:var(--accent)}
input[type=date]{color-scheme:dark;color:var(--gold)}
select option{background:var(--bg2)}

.content{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:12px;min-height:280px;overflow:hidden}
.content.drag{outline:2px dashed var(--accent);outline-offset:-8px;background:var(--bg3)}
.dropmsg{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(20,25,66,.85);font-size:18px;font-weight:600;z-index:5;pointer-events:none}
.content.drag .dropmsg{display:flex}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:#181e4b;user-select:none;white-space:nowrap}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--text)}
th .arr{color:var(--accent);margin-left:4px}
td{padding:10px 14px;border-bottom:1px solid rgba(47,56,120,.55);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(111,128,255,.07)}
.name{display:flex;align-items:center;gap:12px;min-width:0}
.name .t{min-width:0}
.name .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;word-break:break-word}
.name .loc{font-size:12px;color:var(--muted);margin-top:2px}
.name .folderlink{cursor:pointer}
.name .folderlink:hover .n{text-decoration:underline}
.ico{flex:0 0 38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:.3px;color:#0d1033}
.ico.folder{background:transparent}
.ico.folder svg{width:34px;height:34px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;background:rgba(111,128,255,.18);border:1px solid rgba(111,128,255,.4);font-size:12px;font-weight:700;color:#c9d0ff}
.dim{color:var(--muted)}
.gold{color:var(--gold);font-variant-numeric:tabular-nums}
.rowact{display:flex;gap:6px;justify-content:flex-end}
.iconbtn{background:none;border:1px solid transparent;color:var(--muted);width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:hover{background:var(--bg3);border-color:var(--line);color:var(--text)}
.iconbtn.del:hover{color:var(--danger)}
.iconbtn svg{width:17px;height:17px}
.empty{padding:70px 20px;text-align:center;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.6;margin-bottom:10px}
.empty p{margin:6px 0}

.center{max-width:430px;margin:8vh auto;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:34px 30px}
.center.wide{max-width:560px}
.center svg.big{width:60px;height:60px;display:block;margin:0 auto 14px}
.center h2{margin:0 0 8px;font-size:22px;text-align:center}
.center p{color:var(--muted);line-height:1.55;margin:8px 0;text-align:center}
.center label.f{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 5px}
.center input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:var(--text);outline:none;width:100%}
.center input:focus{border-color:var(--accent)}
.center .btn{width:100%;margin-top:20px;padding:12px;font-size:16px}
.erro{color:var(--danger);text-align:center;margin-top:14px;min-height:20px;font-size:14px}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.card h3{margin:0 0 6px;font-size:17px;display:flex;align-items:center;gap:10px}
.card h3 svg{width:19px;height:19px;color:var(--gold)}
.card p{color:var(--muted);line-height:1.55;margin:6px 0 14px}
.card .linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.qrbox{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:14px}
.qrbox canvas,.qrbox img{background:#fff;padding:12px;border-radius:12px;width:212px;height:212px}
.qrinfo{flex:1;min-width:230px}
.qrinfo ol{margin:0 0 12px;padding-left:20px;color:var(--muted);line-height:1.7}
.link{word-break:break-all;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.lista{width:100%;border-collapse:collapse}
.lista td{padding:9px 0;border-bottom:1px solid rgba(47,56,120,.55)}
.lista tr:last-child td{border-bottom:none}

.overlay{position:fixed;inset:0;background:rgba(8,10,35,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:14px;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{margin:0;padding:18px 22px;border-bottom:1px solid var(--line);font-size:17px}
.modal .body{padding:18px 22px;overflow:auto}
.modal .foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.modal p{margin:0 0 12px;color:var(--muted);line-height:1.5}
.modal label.f{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 5px}
.uprow{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(47,56,120,.5)}
.uprow:last-child{border-bottom:none}
.uprow .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uprow .fs{font-size:12px;color:var(--gold)}
.typelist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:20px;background:rgba(111,128,255,.16);border:1px solid rgba(111,128,255,.4);font-weight:600;font-size:13px}
.chip button{background:none;border:none;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:50%;line-height:1;font-size:15px}
.chip button:hover{background:rgba(234,122,114,.25);color:var(--danger)}
.inline{display:flex;gap:8px}
.inline input{flex:1}

#busy{position:fixed;inset:0;background:rgba(8,10,35,.78);display:none;align-items:center;justify-content:center;z-index:80;flex-direction:column;gap:14px;font-weight:600;padding:20px;text-align:center}
#busy.on{display:flex}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#toasts{position:fixed;right:18px;bottom:18px;left:18px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:90;pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--line);border-left:4px solid var(--accent);padding:11px 16px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:380px}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--danger)}
.hide{display:none!important}

@media (max-width:900px){
  .filters{grid-template-columns:1fr 1fr}
  .filters .wide{grid-column:1/-1}
}
@media (max-width:700px){
  .app{padding:14px 12px 40px}
  header{margin-bottom:14px}
  .brand h1{font-size:18px}
  .tab{padding:11px 13px;gap:7px}
  .actions{width:100%}
  .actions .btn{flex:1}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{border-bottom:1px solid var(--line);padding:12px 14px}
  tbody tr:last-child{border-bottom:none}
  td{border:none;padding:2px 0}
  td.meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .rowact{justify-content:flex-start;gap:14px;margin-top:8px}
  .iconbtn{width:40px;height:40px;border:1px solid var(--line)}
  .center{margin:4vh auto;padding:26px 20px}
  .qrbox canvas,.qrbox img{margin:0 auto}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="busy"><div class="spin"></div><div id="busyTxt">Processando...</div></div>
<div id="toasts"></div>

<script>
'use strict';

/* ================= CONFIGURAÇÃO ================= */
const SECOES = [
  {id:'word',     label:'Pasta Word',       dir:'Word',       color:'var(--word)', tipado:true,
   exts:['.doc','.docx','.docm','.dot','.dotx','.rtf','.odt']},
  {id:'ppt',      label:'Pasta PowerPoint', dir:'PowerPoint', color:'var(--ppt)',  tipado:true,
   exts:['.ppt','.pptx','.pptm','.pps','.ppsx','.pot','.potx','.odp']},
  {id:'excel',    label:'Pasta Excel',      dir:'Excel',      color:'var(--xls)',  tipado:true,
   exts:['.xls','.xlsx','.xlsm','.xlsb','.xlt','.xltx','.csv','.ods']},
  {id:'download', label:'Pasta Download',   dir:'Download',   color:'var(--zip)',  tipado:false, exts:null}
];
const QR_LIB = '/vendor/qrcode.min.js';   // biblioteca local, sem depender de internet externa

/* ================= ESTADO ================= */
let eu = null;                   // usuário logado
let dados = {};                  // secId -> {itens:[], tipos:[]}
let cur = {sec:'word', path:[]};
let filt = {q:'', tipo:'', from:'', to:'', sort:'date', dir:'desc'};
let view = [];

const S = () => SECOES.find(s => s.id === cur.sec);
const $ = (sel, el=document) => el.querySelector(sel);

/* ================= UTILITÁRIOS ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ms => {
  const d = new Date(ms);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
};
const fmtSize = b => {
  if (b < 1024) return b + ' B';
  const u = ['KB','MB','GB','TB']; let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < u.length-1);
  return b.toLocaleString('pt-BR',{maximumFractionDigits:b<10?1:0}) + ' ' + u[i];
};
const extOf = n => { const i = n.lastIndexOf('.'); return i > 0 ? n.slice(i).toLowerCase() : ''; };
const samePath = (a,b) => a.length === b.length && a.every((x,i) => x === b[i]);

function toast(msg, kind=''){
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 4800);
}
function busy(on, txt){
  $('#busy').classList.toggle('on', on);
  if (txt) $('#busyTxt').textContent = txt;
}

/* ================= API ================= */
async function api(rota, opcoes = {}){
  const r = await fetch(rota, {
    credentials:'same-origin',
    headers: opcoes.corpo ? {'Content-Type':'application/json'} : undefined,
    method: opcoes.corpo ? 'POST' : (opcoes.metodo || 'GET'),
    body: opcoes.corpo ? JSON.stringify(opcoes.corpo) : undefined
  });
  let dados = {};
  try { dados = await r.json(); } catch(e){}
  if (!r.ok){
    if (r.status === 401 && eu){ eu = null; telaLogin('Sua sessão expirou. Entre de novo.'); }
    throw new Error(dados.erro || 'Falha de comunicação com o servidor.');
  }
  return dados;
}

/* ================= ÍCONES ================= */
const IC = {
  logo:'<svg viewBox="0 0 48 48" fill="none"><rect x="4" y="10" width="40" height="30" rx="5" fill="#C9A048"/><path d="M4 16a5 5 0 015-5h10l4 5h16a5 5 0 015 5v1H4z" fill="#e0bb68"/><rect x="4" y="19" width="40" height="21" rx="5" fill="#C9A048" opacity=".92"/><rect x="12" y="26" width="24" height="3" rx="1.5" fill="#141942" opacity=".55"/><rect x="12" y="32" width="15" height="3" rx="1.5" fill="#141942" opacity=".55"/></svg>',
  folder:'<svg viewBox="0 0 48 48"><path d="M4 12a4 4 0 014-4h11l4 5h17a4 4 0 014 4v21a4 4 0 01-4 4H8a4 4 0 01-4-4z" fill="#C9A048"/><path d="M4 18h40v18a4 4 0 01-4 4H8a4 4 0 01-4-4z" fill="#e0bb68"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3" fill="currentColor"/></svg>',
  open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  empty:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 12a4 4 0 014-4h11l4 5h17a4 4 0 014 4v21a4 4 0 01-4 4H8a4 4 0 01-4-4z"/></svg>',
  cog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5v.2a2 2 0 11-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1h.2a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18.5h2"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>',
  sair:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4M10 8l-4 4 4 4M6 12h10"/></svg>'
};
function fileIcon(name, sec){
  const e = extOf(name).replace('.','').toUpperCase().slice(0,4) || 'ARQ';
  let col = sec.color;
  if (sec.id === 'download'){
    col = /^\.(zip|rar|7z|tar|gz)$/.test(extOf(name)) ? 'var(--zip)' : (extOf(name)==='.pdf' ? '#ef6d6d' : '#9aa6ff');
  }
  return `<div class="ico" style="background:${col}">${esc(e)}</div>`;
}

/* ================= ENTRADA ================= */
async function init(){
  const url = new URL(location.href);
  const par = url.searchParams.get('par');
  if (par){
    busy(true, 'Conectando este aparelho...');
    try {
      const r = await api('/api/auth?action=resgatar', {corpo:{token:par}});
      eu = r.usuario;
      history.replaceState(null, '', location.pathname);
      busy(false);
      toast('Aparelho conectado. Bem-vindo, ' + eu.nome + '!', 'ok');
      return abrirSistema();
    } catch(e){
      busy(false);
      history.replaceState(null, '', location.pathname);
      return telaLogin(e.message);
    }
  }

  busy(true, 'Carregando...');
  try {
    const estado = await api('/api/auth?action=estado');
    busy(false);
    if (!estado.instalado) return telaInstalar();
    if (!estado.usuario) return telaLogin();
    eu = estado.usuario;
    abrirSistema();
  } catch(e){
    busy(false);
    $('#app').innerHTML = `<div class="center">${IC.logo.replace('<svg','<svg class="big"')}
      <h2>Sistema indisponível</h2><p>${esc(e.message)}</p>
      <button class="btn primary" onclick="location.reload()">Tentar de novo</button></div>`;
  }
}

function telaInstalar(){
  $('#app').innerHTML = `<div class="center">${IC.logo.replace('<svg','<svg class="big"')}
    <h2>Primeiro acesso</h2>
    <p>Crie a conta de administrador do sistema. Com ela você entra, envia arquivos e libera o acesso de outras pessoas.</p>
    <label class="f">Seu nome</label><input id="nome" autocomplete="name" placeholder="Ex.: Jean">
    <label class="f">Usuário</label><input id="usuario" autocomplete="username" placeholder="Ex.: jean">
    <label class="f">Senha (mínimo 6 caracteres)</label><input id="senha" type="password" autocomplete="new-password">
    <button class="btn primary" id="ok">Criar administrador</button>
    <div class="erro" id="erro"></div></div>`;
  const enviar = async () => {
    const corpo = {nome:$('#nome').value, usuario:$('#usuario').value, senha:$('#senha').value};
    $('#ok').disabled = true; $('#erro').textContent = '';
    try {
      const r = await api('/api/auth?action=instalar', {corpo});
      eu = r.usuario;
      abrirSistema();
    } catch(e){ $('#erro').textContent = e.message; $('#ok').disabled = false; }
  };
  $('#ok').onclick = enviar;
  $('#senha').onkeydown = e => { if (e.key === 'Enter') enviar(); };
  $('#nome').focus();
}

function telaLogin(aviso){
  $('#app').innerHTML = `<div class="center">${IC.logo.replace('<svg','<svg class="big"')}
    <h2>Organizador de Arquivos</h2>
    <p>Entre para ver e organizar os documentos.</p>
    <label class="f">Usuário</label><input id="usuario" autocomplete="username">

async function abrirSistema(){
  busy(true, 'Carregando arquivos...');
  try {
    cur = {sec:'word', path:[]};
    resetFilters();
    await Promise.all(SECOES.map(s => carregarSecao(s.id)));
    buildShell();
    render();
  } catch(e){
    toast(e.message, 'err');
  } finally { busy(false); }
}

// traz do servidor a lista completa de uma aba
async function carregarSecao(secId){
  const r = await api('/api/arquivos?action=listar&secao=' + secId);
  const sec = SECOES.find(s => s.id === secId);
  dados[secId] = {
    tipos: r.tipos || [],
    itens: r.itens.map(i => i.tipo === 'pasta'
      ? {kind:'dir', name:i.nome, seg:i.seg, path:i.caminho,
         pathname:'arquivos/' + sec.dir + '/' + [...i.caminho, i.seg].join('/') + '/'}
      : {kind:'file', name:i.nome, seg:i.seg, path:i.caminho, pathname:i.pathname,
         size:i.tamanho, date:i.data, tipo:i.classe})
  };
}

// o caminho guardado usa o nome técnico; aqui traduzimos para o nome que a pessoa vê
function nomesDoCaminho(path){
  const mapa = {};
  for (const it of ((dados[cur.sec] || {}).itens || [])){
    if (it.kind === 'dir') mapa[[...it.path, it.seg].join('/')] = it.name;
  }
  return path.map((seg, i) => mapa[path.slice(0, i+1).join('/')] || seg);
}

/* ================= INTERFACE ================= */
function buildShell(){
  $('#app').innerHTML = `
  <header>
    <div class="brand">${IC.logo}<h1>Organizador de Arquivos</h1></div>
    <div class="rootinfo">${IC.user.replace('<svg','<svg style="width:16px;height:16px;vertical-align:-3px"')}
      <b>${esc(eu.nome)}</b>${eu.admin ? '<span class="badge">admin</span>' : ''}
      <button class="btn sm" id="sair">${IC.sair} Sair</button></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="miolo"></div>`;
  $('#sair').onclick = sair;
}

function corpoArquivos(){
  $('#miolo').innerHTML = `
  <div class="toolbar">
    <div class="crumbs" id="crumbs"></div>
    <div class="actions" id="actions"></div>
  </div>
  <div class="filters" id="filters">
    <label class="wide">Nome<input id="fq" type="search" placeholder="Digite parte do nome..." autocomplete="off"></label>
    <label id="ftWrap">Tipo<select id="ft"></select></label>
    <label>Data de<input id="ff" type="date"></label>
    <label>Data até<input id="fu" type="date"></label>
    <button class="btn" id="fclear">Limpar</button>
  </div>
  <div class="content" id="content">
    <div class="dropmsg">Solte os arquivos aqui para enviar</div>
    <div id="list"></div>
  </div>`;

  let tm;
  $('#fq').oninput = e => { clearTimeout(tm); tm = setTimeout(() => { filt.q = e.target.value.trim(); render(); }, 120); };
  $('#ft').onchange = e => { filt.tipo = e.target.value; render(); };
  $('#ff').onchange = e => { filt.from = e.target.value; render(); };
  $('#fu').onchange = e => { filt.to = e.target.value; render(); };
  $('#fclear').onclick = () => { resetFilters(); syncFilterInputs(); render(); };

  const c = $('#content');
  let depth = 0;
  c.addEventListener('dragenter', e => { if (hasFiles(e)){ e.preventDefault(); depth++; c.classList.add('drag'); } });
  c.addEventListener('dragover',  e => { if (hasFiles(e)) e.preventDefault(); });
  c.addEventListener('dragleave', e => { if (hasFiles(e)){ depth--; if (depth <= 0){ depth = 0; c.classList.remove('drag'); } } });
  c.addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; c.classList.remove('drag');
    const arquivos = [...e.dataTransfer.files];
    if (arquivos.length) startUpload(arquivos);
  });
  $('#list').addEventListener('click', onListClick);
}
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');

function resetFilters(){ filt.q = ''; filt.tipo = ''; filt.from = ''; filt.to = ''; }
function syncFilterInputs(){
  if (!$('#fq')) return;
  $('#fq').value = filt.q; $('#ff').value = filt.from; $('#fu').value = filt.to;
  fillTypeFilter();
}
function fillTypeFilter(){
  const sec = S();
  if (!$('#ftWrap')) return;
  $('#ftWrap').classList.toggle('hide', !sec.tipado);
  if (!sec.tipado) return;
  const tipos = (dados[sec.id] || {}).tipos || [];
  $('#ft').innerHTML = `<option value="">Todos</option>` + tipos.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  $('#ft').value = tipos.includes(filt.tipo) ? filt.tipo : '';
  if ($('#ft').value !== filt.tipo) filt.tipo = '';
}

function renderTabs(){
  const abas = SECOES.map(s => {
    const n = ((dados[s.id] || {}).itens || []).filter(i => i.kind === 'file').length;
    return `<button class="tab ${s.id === cur.sec ? 'active' : ''}" data-sec="${s.id}">
      <span class="dot" style="background:${s.color}"></span>${s.label}<span class="count">${n.toLocaleString('pt-BR')}</span></button>`;
  }).join('');
  $('#tabs').innerHTML = abas +
    `<button class="tab ${cur.sec === 'config' ? 'active' : ''}" data-sec="config">${IC.cog} Configurações</button>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    cur = {sec:b.dataset.sec, path:[]};
    resetFilters(); render();
  });
}

function isSearching(){ return !!(filt.q || filt.tipo || filt.from || filt.to); }

function getVisible(){
  const sec = S(), all = (dados[sec.id] || {}).itens || [];
  const q = filt.q.toLowerCase();
  const from = filt.from ? new Date(filt.from + 'T00:00:00').getTime() : null;
  const to = filt.to ? new Date(filt.to + 'T23:59:59.999').getTime() : null;
  let items;
  if (!isSearching()){
    items = all.filter(i => samePath(i.path, cur.path));
  } else {
    items = all.filter(i => {
      if (i.kind === 'dir') return q && !filt.tipo && from === null && to === null && i.name.toLowerCase().includes(q);
      if (q && !i.name.toLowerCase().includes(q)) return false;
      if (filt.tipo && i.tipo !== filt.tipo) return false;
      if (from !== null && i.date < from) return false;
      if (to !== null && i.date > to) return false;
      return true;
    });
  }
  const dirMul = filt.dir === 'asc' ? 1 : -1;
  const cmpName = (a, b) => a.name.localeCompare(b.name, 'pt-BR', {numeric:true, sensitivity:'base'});
  items.sort((a, b) => {
    if (a.kind !== b.kind) return a.kind === 'dir' ? -1 : 1;
    if (a.kind === 'dir') return cmpName(a, b);
    let r = 0;
    if (filt.sort === 'name') r = cmpName(a, b);
    else if (filt.sort === 'date') r = a.date - b.date;
    else if (filt.sort === 'tipo') r = (a.tipo || '').localeCompare(b.tipo || '', 'pt-BR') || cmpName(a, b);
    else if (filt.sort === 'size') r = a.size - b.size;
    return r * dirMul || cmpName(a, b);
  });
  return items;
}

function render(){
  renderTabs();
  if (cur.sec === 'config') return telaConfig();
  if (!$('#content')) corpoArquivos();
  syncFilterInputs();
  const sec = S();
  view = getVisible();

  const parts = [{label:sec.label, path:[]}];
  nomesDoCaminho(cur.path).forEach((nome, i) => parts.push({label:nome, path:cur.path.slice(0, i+1)}));
  if (isSearching()){
    const nf = view.filter(v => v.kind === 'file').length;
    $('#crumbs').innerHTML = `<span class="res">Resultados da busca em <b style="color:var(--text)">${esc(sec.label)}</b>: <b>${nf.toLocaleString('pt-BR')}</b> arquivo${nf === 1 ? '' : 's'}</span>`;
  } else {
    $('#crumbs').innerHTML = parts.map((p, i) => {
      const last = i === parts.length - 1;
      return (i ? '<span class="sep">›</span>' : '') + `<button class="${last ? 'last' : ''}" data-go="${i}">${esc(p.label)}</button>`;
    }).join('');
    document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
      const i = +b.dataset.go; cur.path = parts[i].path; render();
    });
  }

  $('#actions').innerHTML =
    `<button class="btn" id="aFolder">${IC.plus} Nova pasta</button>` +
    (sec.tipado ? `<button class="btn" id="aTypes">${IC.tag} Tipos</button>` : '') +
    `<button class="btn primary" id="aUp">${IC.upload} Enviar arquivos</button>`;
  $('#aFolder').onclick = newFolder;
  if (sec.tipado) $('#aTypes').onclick = manageTypes;
  $('#aUp').onclick = pickFiles;

  renderList();
}

function renderList(){
  const sec = S();
  if (!view.length){
    $('#list').innerHTML = `<div class="empty">${IC.empty}<p style="font-size:17px;color:var(--text)">${isSearching() ? 'Nenhum resultado encontrado' : 'Esta pasta está vazia'}</p>
      <p>${isSearching() ? 'Ajuste ou limpe os filtros.' : 'Use o botão <b>Enviar arquivos</b> para adicionar documentos.'}</p></div>`;
    return;
  }
  const all = (dados[sec.id] || {}).itens || [];
  const searching = isSearching();
  const arrow = k => filt.sort === k ? `<span class="arr">${filt.dir === 'asc' ? '▲' : '▼'}</span>` : '';
  const rows = view.map((it, idx) => {
    const loc = searching ? `<div class="loc">${esc([sec.dir, ...nomesDoCaminho(it.path)].join(' / '))}</div>` : '';
    if (it.kind === 'dir'){
      const full = [...it.path, it.name];
      const n = all.filter(x => x.kind === 'file' && x.path.length >= full.length && full.every((p, i) => x.path[i] === p)).length;
      return `<tr>
        <td><div class="name folderlink" data-act="enter" data-i="${idx}"><div class="ico folder">${IC.folder}</div>
          <div class="t"><div class="n">${esc(it.name)}</div>${loc}</div></div></td>
        <td class="meta"><span class="dim">Pasta</span></td>
        <td class="meta"><span class="gold">${n.toLocaleString('pt-BR')}</span> <span class="dim">${n === 1 ? 'arquivo' : 'arquivos'}</span></td>
        <td class="meta"><span class="dim">—</span></td>
        <td><div class="rowact">
          <button class="iconbtn del" title="Excluir pasta" data-act="del" data-i="${idx}">${IC.trash}</button></div></td></tr>`;
    }
    return `<tr>
      <td><div class="name">${fileIcon(it.name, sec)}<div class="t"><div class="n">${esc(it.name)}</div>${loc}</div></div></td>
      <td class="meta">${sec.tipado ? (it.tipo ? `<span class="badge">${esc(it.tipo)}</span>` : '<span class="dim">sem tipo</span>') : '<span class="dim">' + esc(extOf(it.name).replace('.','').toUpperCase() || '—') + '</span>'}</td>
      <td class="meta gold">${fmtDate(it.date)}</td>
      <td class="meta gold">${fmtSize(it.size)}</td>
      <td><div class="rowact">
        <button class="iconbtn" title="Abrir / baixar" data-act="open" data-i="${idx}">${IC.open}</button>
        ${sec.tipado ? `<button class="iconbtn" title="Alterar tipo" data-act="tipo" data-i="${idx}">${IC.tag}</button>` : ''}
        <button class="iconbtn del" title="Excluir" data-act="del" data-i="${idx}">${IC.trash}</button></div></td></tr>`;
  }).join('');
  $('#list').innerHTML = `<table><thead><tr>
    <th class="sortable" data-sort="name">Nome ${arrow('name')}</th>
    <th class="sortable" data-sort="${sec.tipado ? 'tipo' : 'name'}">${sec.tipado ? 'Tipo ' + arrow('tipo') : 'Formato'}</th>
    <th class="sortable" data-sort="date">Data ${arrow('date')}</th>
    <th class="sortable" data-sort="size">Tamanho ${arrow('size')}</th>
    <th></th></tr></thead><tbody>${rows}</tbody></table>`;
  document.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    if (filt.sort === k) filt.dir = filt.dir === 'asc' ? 'desc' : 'asc';
    else { filt.sort = k; filt.dir = k === 'date' || k === 'size' ? 'desc' : 'asc'; }
    render();
  });
}

function onListClick(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const it = view[+el.dataset.i];
  if (!it) return;
  const act = el.dataset.act;
  if (act === 'enter'){ cur.path = [...it.path, it.seg]; resetFilters(); render(); }
  else if (act === 'open') openItem(it);
  else if (act === 'tipo') editType(it);
  else if (act === 'del') deleteItem(it);
}

/* ================= MODAL ================= */
function openModal(title, bodyHtml, buttons){
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" role="dialog"><h3>${esc(title)}</h3><div class="body">${bodyHtml}</div><div class="foot"></div></div>`;
  const foot = $('.foot', ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls || ''); btn.textContent = b.label;
    btn.onclick = () => b.fn ? b.fn(close, ov) : close();
    foot.appendChild(btn);
  });
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  document.body.appendChild(ov);
  const first = $('input,select', ov); if (first) first.focus();
  return {ov, close};
}

/* ================= AÇÕES EM ARQUIVOS ================= */
async function recarregar(){
  await carregarSecao(cur.sec);
  // se a pasta aberta deixou de existir, volta um nível
  const itens = dados[cur.sec].itens;
  for (let i = 1; i <= cur.path.length; i++){
    const p = cur.path.slice(0, i);
    const existe = itens.some(x => x.kind === 'dir' && samePath(x.path, p.slice(0,-1)) && x.seg === p[p.length-1]);
    if (!existe){ cur.path = p.slice(0,-1); break; }
  }
  render();
}

function newFolder(){
  const {ov} = openModal('Nova pasta',
    `<label class="f" style="margin-top:0">Nome da pasta</label><input id="nfName" type="text" maxlength="100" placeholder="Ex.: Políticas 2026" autocomplete="off">`,
    [{label:'Cancelar'}, {label:'Criar pasta', cls:'primary', fn: async (close, ov) => {
      const nome = $('#nfName', ov).value.trim();
      if (!nome) return toast('Digite um nome válido.', 'err');
      busy(true, 'Criando pasta...');
      try {
        await api('/api/arquivos?action=pasta', {corpo:{secao:cur.sec, caminho:cur.path, nome}});
        close(); await recarregar(); toast('Pasta criada.', 'ok');
      } catch(e){ toast(e.message, 'err'); }
      finally { busy(false); }
    }}]);
  $('#nfName', ov).addEventListener('keydown', e => { if (e.key === 'Enter') $('.btn.primary', ov).click(); });
}

function deleteItem(it){
  const isDir = it.kind === 'dir';
  let extra = '';
  if (isDir){
    const full = [...it.path, it.name];
    const n = ((dados[cur.sec] || {}).itens || []).filter(x => x.kind === 'file' && x.path.length >= full.length && full.every((p, i) => x.path[i] === p)).length;
    extra = n ? ` Ela contém <b class="gold">${n.toLocaleString('pt-BR')}</b> arquivo${n === 1 ? '' : 's'} que também ser${n === 1 ? 'á' : 'ão'} excluído${n === 1 ? '' : 's'}.` : '';
  }
  openModal(isDir ? 'Excluir pasta' : 'Excluir arquivo',
    `<p>Excluir <b style="color:var(--text)">${esc(it.name)}</b>?${extra} Esta ação não pode ser desfeita.</p>`,
    [{label:'Cancelar'}, {label:'Excluir', cls:'danger', fn: async close => {
      busy(true, 'Excluindo...');
      try {
        await api('/api/arquivos?action=excluir', {corpo:{pathname:it.pathname, pasta:isDir}});
        close(); await recarregar(); toast('Excluído.', 'ok');
      } catch(e){ toast(e.message, 'err'); }
      finally { busy(false); }
    }}]);
}

function openItem(it){
  window.open('/api/arquivos?action=baixar&p=' + encodeURIComponent(it.pathname), '_blank');
}

function typeOptions(tipos, selecionado){
  return `<option value="">— sem tipo —</option>` + tipos.map(t => `<option value="${esc(t)}" ${t === selecionado ? 'selected' : ''}>${esc(t)}</option>`).join('');
}

function editType(it){
  const tipos = (dados[cur.sec] || {}).tipos || [];
  openModal('Alterar tipo',
    `<p>${esc(it.name)}</p><label class="f" style="margin-top:0">Tipo</label><select id="etSel">${typeOptions(tipos, it.tipo)}</select>`,
    [{label:'Cancelar'}, {label:'Salvar', cls:'primary', fn: async (close, ov) => {
      const v = $('#etSel', ov).value;
      try {
        await api('/api/arquivos?action=tipo', {corpo:{pathname:it.pathname, tipo:v}});
        it.tipo = v; close(); render(); toast('Tipo atualizado.', 'ok');
      } catch(e){ toast(e.message, 'err'); }
    }}]);
}

function manageTypes(){
  const secId = cur.sec;
  const desenhar = ov => {
    const tipos = dados[secId].tipos || [];
    $('#tmList', ov).innerHTML = tipos.length
      ? tipos.map((t, i) => `<span class="chip">${esc(t)}<button data-rm="${i}" title="Remover">×</button></span>`).join('')
      : '<span class="dim">Nenhum tipo cadastrado.</span>';
    ov.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
      const lista = tipos.slice();
      lista.splice(+b.dataset.rm, 1);
      await salvarTipos(secId, lista, ov, desenhar);
    });
  };
  const {ov} = openModal('Tipos de ' + SECOES.find(s => s.id === secId).dir,
    `<p>Os tipos servem para classificar e filtrar os arquivos desta aba. Remover um tipo não apaga os arquivos.</p>
     <div class="typelist" id="tmList"></div>
     <label class="f">Novo tipo</label>
     <div class="inline"><input id="tmNew" type="text" maxlength="30" placeholder="Ex.: MAN" autocomplete="off"><button class="btn primary" id="tmAdd">Adicionar</button></div>`,
    [{label:'Fechar', cls:'primary', fn: close => { close(); render(); }}]);
  desenhar(ov);
  const add = async () => {
    const v = $('#tmNew', ov).value.trim();
    if (!v) return;
    const lista = (dados[secId].tipos || []).slice();
    if (lista.some(t => t.toLowerCase() === v.toLowerCase())) return toast('Esse tipo já existe.', 'err');
    lista.push(v);
    $('#tmNew', ov).value = '';
    await salvarTipos(secId, lista, ov, desenhar);
  };
  $('#tmAdd', ov).onclick = add;
  $('#tmNew', ov).addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
}
async function salvarTipos(secId, lista, ov, desenhar){
  try {
    const r = await api('/api/arquivos?action=tipos', {corpo:{secao:secId, lista}});
    dados[secId].tipos = r.tipos;
    desenhar(ov); fillTypeFilter();
  } catch(e){ toast(e.message, 'err'); }
}

/* ================= ENVIO ================= */
function pickFiles(){
  const sec = S();
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  if (sec.exts) inp.accept = sec.exts.join(',');
  inp.onchange = () => { if (inp.files.length) startUpload([...inp.files]); };
  inp.click();
}

function guessType(name, tipos){
  const up = name.toUpperCase();
  const ordenados = [...tipos].sort((a, b) => b.length - a.length);
  for (const t of ordenados){
    const T = t.toUpperCase();
    if (up.startsWith(T) && (up.length === T.length || !/[A-Z0-9À-Ü]/i.test(up[T.length]))) return t;
  }
  return '';
}

function startUpload(arquivos){
  const sec = S();
  let lista = arquivos;
  if (sec.exts){
    const fora = arquivos.filter(f => !sec.exts.includes(extOf(f.name)));
    lista = arquivos.filter(f => sec.exts.includes(extOf(f.name)));
    if (fora.length) toast(`${fora.length} arquivo${fora.length > 1 ? 's' : ''} ignorado${fora.length > 1 ? 's' : ''} (formato não pertence a esta aba): ${fora.slice(0,3).map(f => f.name).join(', ')}${fora.length > 3 ? '...' : ''}`, 'err');
  }
  if (!lista.length) return;
  if (!sec.tipado) return doUpload(lista.map(f => ({file:f, tipo:''})));

  const tipos = (dados[sec.id] || {}).tipos || [];
  const escolha = lista.map(f => guessType(f.name, tipos));
  const linhas = lista.map((f, i) => `<div class="uprow"><div><div class="fn" title="${esc(f.name)}">${esc(f.name)}</div><div class="fs">${fmtSize(f.size)}</div></div>
      <select data-up="${i}">${typeOptions(tipos, escolha[i])}</select></div>`).join('');
  const {ov} = openModal(`Enviar ${lista.length} arquivo${lista.length > 1 ? 's' : ''}`,
    `<p>Escolha o tipo de cada documento. Se o nome começa com o código (ex.: <b>POL</b> - Política...), o tipo já vem preenchido.</p>
     ${lista.length > 1 ? `<label class="f" style="margin-top:0">Aplicar o mesmo tipo a todos</label><select id="upAll">${typeOptions(tipos, '')}</select><div style="height:10px"></div>` : ''}
     <div id="upRows">${linhas}</div>`,
    [{label:'Cancelar'}, {label:'Enviar', cls:'primary', fn: async close => {
      const entradas = lista.map((f, i) => ({file:f, tipo:$(`[data-up="${i}"]`, ov).value}));
      close(); doUpload(entradas);
    }}]);
  const todos = $('#upAll', ov);
  if (todos) todos.onchange = () => ov.querySelectorAll('[data-up]').forEach(s => s.value = todos.value);
}

// envia o arquivo direto do navegador para o armazenamento, sem limite de tamanho
function enviarArquivo(url, file, aoProgredir){
  return new Promise((ok, erro) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('x-content-type', file.type || 'application/octet-stream');
    x.upload.onprogress = e => { if (e.lengthComputable) aoProgredir(e.loaded / e.total); };
    x.onload = () => (x.status >= 200 && x.status < 300) ? ok() : erro(new Error('O armazenamento recusou o arquivo (' + x.status + ').'));
    x.onerror = () => erro(new Error('Falha de rede durante o envio.'));
    x.send(file);
  });
}

async function doUpload(entradas){
  busy(true, 'Enviando...');
  let ok = 0;
  try {
    for (let i = 0; i < entradas.length; i++){
      const {file, tipo} = entradas[i];
      const rotulo = `Enviando ${i + 1} de ${entradas.length}`;
      $('#busyTxt').textContent = rotulo + '...';
      const destino = await api('/api/arquivos?action=enviar', {
        corpo:{secao:cur.sec, caminho:cur.path, nome:file.name, contentType:file.type || 'application/octet-stream'}
      });
      await enviarArquivo(destino.url, file, p => {
        $('#busyTxt').textContent = `${rotulo} — ${Math.round(p * 100)}%`;
      });
      await api('/api/arquivos?action=confirmar', {corpo:{pathname:destino.pathname, tipo, nome:file.name}});
      ok++;
    }
    await recarregar();
    toast(`${ok} arquivo${ok > 1 ? 's' : ''} enviado${ok > 1 ? 's' : ''}.`, 'ok');
  } catch(e){
    toast('Erro no envio: ' + e.message, 'err');
    if (ok) await recarregar();
  } finally { busy(false); }
}

function telaConfig(){
  $('#miolo').innerHTML = `
  <div class="card">
    <h3>${IC.phone} Conectar com dispositivo móvel</h3>
    <p>Gere um QR Code e leia com a câmera do celular. O aparelho entra já conectado na sua conta e pode ver, enviar, baixar e excluir arquivos e criar pastas — de qualquer lugar, mesmo com este computador desligado.</p>
    <div class="linha"><button class="btn primary" id="qrGerar">${IC.phone} Gerar QR Code</button></div>
    <div id="qrArea"></div>
  </div>
  <div class="card">
    <h3>${IC.user} Minha conta</h3>
    <p>Você está conectado como <b style="color:var(--text)">${esc(eu.nome)}</b> (usuário <b style="color:var(--text)">${esc(eu.usuario)}</b>).</p>
    <div class="linha"><button class="btn" id="trocarSenha">Trocar minha senha</button></div>
  </div>
  <div class="card" id="cardUsuarios"></div>`;
  $('#qrGerar').onclick = gerarQR;

function carregarQRLib(){
  if (window.QRCode) return Promise.resolve(true);
  return new Promise(ok => {
    const s = document.createElement('script');
    s.src = QR_LIB;
    s.onload = () => ok(!!window.QRCode);
    s.onerror = () => ok(false);
    document.head.appendChild(s);
  });
}

async function gerarQR(){
  const area = $('#qrArea');
  area.innerHTML = '<p class="dim" style="margin-top:14px">Gerando código...</p>';
  try {
    const r = await api('/api/auth?action=parear', {corpo:{}});
    const temLib = await carregarQRLib();
    const minutos = Math.max(1, Math.round((r.expiraEm - Date.now()) / 60000));
    area.innerHTML = `<div class="qrbox">
      <canvas id="qrCanvas"></canvas>
      <div class="qrinfo">
        <ol>
          <li>Abra a câmera do celular e aponte para o código.</li>
          <li>Toque no link que aparecer na tela.</li>
          <li>Pronto: o celular abre o sistema já conectado.</li>
        </ol>
        <p class="dim" style="margin:0 0 10px">Vale por ${minutos} minutos e só pode ser usado uma vez. O celular continua conectado depois disso.</p>
        <div class="link" id="qrLink">${esc(r.url)}</div>
        <div class="linha" style="margin-top:10px">
          <button class="btn sm" id="qrCopiar">Copiar link</button>
          <button class="btn sm" id="qrNovo">Gerar outro</button>
        </div>
      </div></div>`;
    if (temLib){
      window.QRCode.toCanvas($('#qrCanvas'), r.url, {width:188, margin:1, color:{dark:'#141942', light:'#ffffff'}}, err => {
        if (err) $('#qrCanvas').replaceWith(Object.assign(document.createElement('p'), {className:'dim', textContent:'Não foi possível desenhar o QR Code. Use o link abaixo.'}));
      });
    } else {
      $('#qrCanvas').replaceWith(Object.assign(document.createElement('p'),
        {className:'dim', textContent:'Não foi possível carregar o desenhador de QR Code. Envie o link abaixo para o celular.'}));
    }
    $('#qrCopiar').onclick = async () => {
      try { await navigator.clipboard.writeText(r.url); toast('Link copiado.', 'ok'); }
      catch(e){ toast('Copie o link manualmente.', 'err'); }
    };
    $('#qrNovo').onclick = gerarQR;
  } catch(e){
    area.innerHTML = `<p class="erro" style="text-align:left">${esc(e.message)}</p>`;
  }
}

function trocarSenha(){
  const {ov} = openModal('Trocar minha senha',

     <label class="f">Nova senha (mínimo 6 caracteres)</label><input id="sNova" type="password" autocomplete="new-password">`,
    [{label:'Cancelar'}, {label:'Salvar', cls:'primary', fn: async close => {
      try {
        await api('/api/usuarios?action=senha', {corpo:{atual:$('#sAtual', ov).value, nova:$('#sNova', ov).value}});

async function montarUsuarios(){
  const card = $('#cardUsuarios');
  card.innerHTML = `<h3>${IC.user} Pessoas com acesso</h3>
    <p>Cada pessoa entra com o próprio usuário e senha e enxerga os mesmos arquivos.</p>

  $('#uNovo').onclick = novoUsuario;
  try {
    const r = await api('/api/usuarios?action=listar');
    $('#uLista').classList.remove('dim');
    $('#uLista').innerHTML = `<table class="lista">${r.usuarios.map(u => `<tr>
      <td><b>${esc(u.nome)}</b> <span class="dim">@${esc(u.usuario)}</span> ${u.admin ? '<span class="badge">admin</span>' : ''}</td>
      <td style="text-align:right">${u.id === eu.id ? '<span class="dim">você</span>'
        : `<button class="btn sm danger" data-rm="${esc(u.id)}" data-nome="${esc(u.nome)}">Remover</button>`}</td></tr>`).join('')}</table>`;
    card.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => removerUsuario(b.dataset.rm, b.dataset.nome));
  } catch(e){ $('#uLista').textContent = e.message; }
}

function novoUsuario(){
  const {ov} = openModal('Adicionar pessoa',
    `<label class="f" style="margin-top:0">Nome</label><input id="uN" autocomplete="off">
     <label class="f">Usuário (sem espaços)</label><input id="uU" autocomplete="off">
     <label class="f">Senha (mínimo 6 caracteres)</label><input id="uS" type="password" autocomplete="new-password">
     <label class="f" style="text-transform:none;letter-spacing:0;font-size:14px">
       <input type="checkbox" id="uA" style="width:auto;margin-right:8px">Também é administrador</label>`,
    [{label:'Cancelar'}, {label:'Criar', cls:'primary', fn: async close => {

        await api('/api/usuarios?action=criar', {corpo:{
          nome:$('#uN', ov).value, usuario:$('#uU', ov).value, senha:$('#uS', ov).value, admin:$('#uA', ov).checked

        close(); montarUsuarios(); toast('Pessoa adicionada. Informe a ela o usuário e a senha.', 'ok');
      } catch(e){ toast(e.message, 'err'); }
    }}]);
}

function removerUsuario(id, nome){
  openModal('Remover acesso',
    `<p>Remover o acesso de <b style="color:var(--text)">${esc(nome)}</b>? Os arquivos continuam no sistema.</p>`,
    [{label:'Cancelar'}, {label:'Remover', cls:'danger', fn: async close => {
      try {
        await api('/api/usuarios?action=excluir', {corpo:{id}});
        close(); montarUsuarios(); toast('Acesso removido.', 'ok');
      } catch(e){ toast(e.message, 'err'); }
    }}]);
}

  try { await api('/api/auth?action=sair', {corpo:{}}); } catch(e){}
