<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organizador de Arquivos</title>
<style>
:root{
  --bg:#141942;
  --bg2:#1a2050;
  --bg3:#222a63;
  --line:#2f3878;
  --text:#e9ebf7;
  --muted:#98a0d0;
  --gold:#C9A048;
  --accent:#6f80ff;
  --accent-d:#4d5fe0;
  --danger:#ea7a72;
  --ok:#6cc79a;
  --word:#4f8cff;
  --ppt:#ff8a5c;
  --xls:#4fcf8f;
  --zip:#c9a048;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
.app{max-width:1240px;margin:0 auto;padding:22px 24px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:34px;height:34px}
.brand h1{margin:0;font-size:21px;font-weight:600;letter-spacing:.2px}
.rootinfo{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.rootinfo b{color:var(--text);font-weight:600}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg2);padding:8px 14px;border-radius:9px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--bg3);border-color:#3f4a95}
.btn.primary{background:var(--accent-d);border-color:var(--accent-d);font-weight:600}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn svg{width:16px;height:16px}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:10px;padding:12px 18px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;font-weight:600;white-space:nowrap;border-radius:10px 10px 0 0}
.tab:hover{color:var(--text);background:var(--bg2)}
.tab.active{color:var(--text);background:var(--bg2);border-bottom-color:var(--accent)}
.tab .dot{width:10px;height:10px;border-radius:3px}
.tab .count{color:var(--gold);font-weight:700;font-size:13px;background:rgba(201,160,72,.12);padding:1px 8px;border-radius:20px;min-width:24px;text-align:center}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:15px}
.crumbs button{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px;font-weight:600}
.crumbs button:hover{background:var(--bg2);color:var(--text)}
.crumbs button.last{color:var(--text);cursor:default}
.crumbs button.last:hover{background:none}
.crumbs .sep{color:var(--line)}
.crumbs .res{color:var(--muted)}
.crumbs .res b{color:var(--gold)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.filters{display:grid;grid-template-columns:2fr 1.1fr 1fr 1fr auto;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.filters input,.filters select,.modal input,.modal select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);outline:none;width:100%}
.filters input:focus,.filters select:focus,.modal input:focus,.modal select:focus{border-color:var(--accent)}
input[type=date]{color-scheme:dark;color:var(--gold)}
select option{background:var(--bg2)}

.content{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:12px;min-height:280px;overflow:hidden}
.content.drag{outline:2px dashed var(--accent);outline-offset:-8px;background:var(--bg3)}
.dropmsg{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(20,25,66,.85);font-size:18px;font-weight:600;z-index:5;pointer-events:none}
.content.drag .dropmsg{display:flex}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:#181e4b;user-select:none;white-space:nowrap}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--text)}
th .arr{color:var(--accent);margin-left:4px}
td{padding:10px 14px;border-bottom:1px solid rgba(47,56,120,.55);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(111,128,255,.07)}
.name{display:flex;align-items:center;gap:12px;min-width:0}
.name .t{min-width:0}
.name .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;word-break:break-word}
.name .loc{font-size:12px;color:var(--muted);margin-top:2px}
.name .folderlink{cursor:pointer}
.name .folderlink:hover .n{text-decoration:underline}
.ico{flex:0 0 38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:.3px;color:#0d1033}
.ico.folder{background:transparent}
.ico.folder svg{width:34px;height:34px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;background:rgba(111,128,255,.18);border:1px solid rgba(111,128,255,.4);font-size:12px;font-weight:700;color:#c9d0ff}
.dim{color:var(--muted)}
.gold{color:var(--gold);font-variant-numeric:tabular-nums}
.rowact{display:flex;gap:6px;justify-content:flex-end}
.iconbtn{background:none;border:1px solid transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:hover{background:var(--bg3);border-color:var(--line);color:var(--text)}
.iconbtn.del:hover{color:var(--danger)}
.iconbtn svg{width:17px;height:17px}
.empty{padding:70px 20px;text-align:center;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.6;margin-bottom:10px}
.empty p{margin:6px 0}

.center{max-width:560px;margin:70px auto;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:40px 34px}
.center svg.big{width:64px;height:64px;margin-bottom:12px}
.center h2{margin:0 0 10px;font-size:22px}
.center p{color:var(--muted);line-height:1.55;margin:8px 0}
.center .btn{margin-top:18px;padding:11px 20px;font-size:16px}

.overlay{position:fixed;inset:0;background:rgba(8,10,35,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:14px;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{margin:0;padding:18px 22px;border-bottom:1px solid var(--line);font-size:17px}
.modal .body{padding:18px 22px;overflow:auto}
.modal .foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.modal p{margin:0 0 12px;color:var(--muted);line-height:1.5}
.modal label.f{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 5px}
.uprow{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(47,56,120,.5)}
.uprow:last-child{border-bottom:none}
.uprow .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uprow .fs{font-size:12px;color:var(--gold)}
.typelist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:20px;background:rgba(111,128,255,.16);border:1px solid rgba(111,128,255,.4);font-weight:600;font-size:13px}
.chip button{background:none;border:none;color:var(--muted);cursor:pointer;width:20px;height:20px;border-radius:50%;line-height:1;font-size:15px}
.chip button:hover{background:rgba(234,122,114,.25);color:var(--danger)}
.inline{display:flex;gap:8px}
.inline input{flex:1}

#busy{position:fixed;inset:0;background:rgba(8,10,35,.78);display:none;align-items:center;justify-content:center;z-index:80;flex-direction:column;gap:14px;font-weight:600}
#busy.on{display:flex}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--bg3);border:1px solid var(--line);border-left:4px solid var(--accent);padding:11px 16px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:380px}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--danger)}
.hide{display:none!important}

@media (max-width:900px){
  .filters{grid-template-columns:1fr 1fr}
  .filters .wide{grid-column:1/-1}
  .col-size,.col-tipo{display:none}
}
@media (max-width:560px){.app{padding:14px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="busy"><div class="spin"></div><div id="busyTxt">Processando...</div></div>
<div id="toasts"></div>

<script>
'use strict';

/* ================= CONFIGURAÇÃO ================= */
const SECTIONS = [
  {id:'word',     label:'Pasta Word',       dir:'Word',       color:'var(--word)', typed:true,
   exts:['.doc','.docx','.docm','.dot','.dotx','.rtf','.odt'], types:['POL','FF','FT','PR','IT','RG']},
  {id:'ppt',      label:'Pasta PowerPoint', dir:'PowerPoint', color:'var(--ppt)',  typed:true,
   exts:['.ppt','.pptx','.pptm','.pps','.ppsx','.pot','.potx','.odp'], types:['Apresentação','Treinamento','Reunião','Relatório']},
  {id:'excel',    label:'Pasta Excel',      dir:'Excel',      color:'var(--xls)',  typed:true,
   exts:['.xls','.xlsx','.xlsm','.xlsb','.xlt','.xltx','.csv','.ods'], types:['Controle','Indicadores','Planilha','Relatório']},
  {id:'download', label:'Pasta Download',   dir:'Download',   color:'var(--zip)',  typed:false, exts:null, types:[]}
];
const META_FILE = '_sistema.json';

/* ================= ESTADO ================= */
let root = null;                 // handle da pasta raiz
let connected = false;           // true quando a pasta está autorizada e aberta
let secHandles = {};             // id -> handle da pasta da aba
let meta = null;                 // metadados (tipos e tipo de cada arquivo)
let cache = {};                  // id -> lista recursiva de itens
let cur = {sec:'word', path:[]};
let filt = {q:'', tipo:'', from:'', to:'', sort:'date', dir:'desc'};
let view = [];                   // itens exibidos atualmente

const S = () => SECTIONS.find(s => s.id === cur.sec);
const $ = (sel, el=document) => el.querySelector(sel);

/* ================= UTILITÁRIOS ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ms => {
  const d = new Date(ms);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
};
const fmtSize = b => {
  if (b < 1024) return b + ' B';
  const u = ['KB','MB','GB','TB']; let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < u.length-1);
  return b.toLocaleString('pt-BR',{maximumFractionDigits:b<10?1:0}) + ' ' + u[i];
};
const extOf = n => { const i = n.lastIndexOf('.'); return i > 0 ? n.slice(i).toLowerCase() : ''; };
const cleanName = n => n.replace(/[\\/:*?"<>|]/g,'').trim().replace(/\.+$/,'');
const samePath = (a,b) => a.length === b.length && a.every((x,i) => x === b[i]);
const metaKey = (sec, path, name) => sec.dir + '/' + [...path, name].join('/');

function toast(msg, kind=''){
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 4800);
}
function busy(on, txt){
  $('#busy').classList.toggle('on', on);
  if (txt) $('#busyTxt').textContent = txt;
}

/* ================= ÍCONES ================= */
const IC = {
  logo:'<svg viewBox="0 0 48 48" fill="none"><rect x="4" y="10" width="40" height="30" rx="5" fill="#C9A048"/><path d="M4 16a5 5 0 015-5h10l4 5h16a5 5 0 015 5v1H4z" fill="#e0bb68"/><rect x="4" y="19" width="40" height="21" rx="5" fill="#C9A048" opacity=".92"/><rect x="12" y="26" width="24" height="3" rx="1.5" fill="#141942" opacity=".55"/><rect x="12" y="32" width="15" height="3" rx="1.5" fill="#141942" opacity=".55"/></svg>',
  folder:'<svg viewBox="0 0 48 48"><path d="M4 12a4 4 0 014-4h11l4 5h17a4 4 0 014 4v21a4 4 0 01-4 4H8a4 4 0 01-4-4z" fill="#C9A048"/><path d="M4 18h40v18a4 4 0 01-4 4H8a4 4 0 01-4-4z" fill="#e0bb68"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3" fill="currentColor"/></svg>',
  open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>',
  empty:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 12a4 4 0 014-4h11l4 5h17a4 4 0 014 4v21a4 4 0 01-4 4H8a4 4 0 01-4-4z"/></svg>'
};
function fileIcon(name, sec){
  const e = extOf(name).replace('.','').toUpperCase().slice(0,4) || 'ARQ';
  let col = sec.color;
  if (sec.id === 'download'){
    col = /^\.(zip|rar|7z|tar|gz)$/.test(extOf(name)) ? 'var(--zip)' : (extOf(name)==='.pdf' ? '#ef6d6d' : '#9aa6ff');
  }
  return `<div class="ico" style="background:${col}">${esc(e)}</div>`;
}

/* ================= INDEXEDDB (guarda a pasta escolhida) ================= */
const idb = () => new Promise((res, rej) => {
  const r = indexedDB.open('organizador-arquivos', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function kvGet(k){
  const db = await idb();
  return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function kvSet(k, v){
  const db = await idb();
  return new Promise((res, rej) => { const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
}

/* ================= SISTEMA DE ARQUIVOS ================= */
async function exists(dir, name){
  try { await dir.getFileHandle(name); return true; } catch(e){}
  try { await dir.getDirectoryHandle(name); return true; } catch(e){}
  return false;
}
async function uniqueName(dir, name){
  if (!(await exists(dir, name))) return name;
  const i = name.lastIndexOf('.');
  const base = i > 0 ? name.slice(0,i) : name, ext = i > 0 ? name.slice(i) : '';
  let n = 2;
  while (await exists(dir, `${base} (${n})${ext}`)) n++;
  return `${base} (${n})${ext}`;
}
async function saveFile(dir, file){
  const name = await uniqueName(dir, file.name);
  const fh = await dir.getFileHandle(name, {create:true});
  const w = await fh.createWritable();
  await file.stream().pipeTo(w);
  return name;
}
async function copyDir(src, dst){
  for await (const [n, h] of src.entries()){
    if (h.kind === 'file') await saveFile(dst, await h.getFile());
    else await copyDir(h, await dst.getDirectoryHandle(n, {create:true}));
  }
}
async function getDir(secId, path){
  let d = secHandles[secId];
  for (const p of path) d = await d.getDirectoryHandle(p);
  return d;
}
async function saveMeta(){
  if (!connected) return;
  const fh = await root.getFileHandle(META_FILE, {create:true});
  const w = await fh.createWritable();
  await w.write(JSON.stringify(meta, null, 1));
  await w.close();
}
async function scanDir(sec, dir, path, out){
  const entries = [];
  for await (const e of dir.entries()) entries.push(e);
  await Promise.all(entries.map(async ([name, h]) => {
    if (h.kind === 'directory'){
      out.push({kind:'dir', name, handle:h, parent:dir, path});
      await scanDir(sec, h, [...path, name], out);
    } else if (!name.startsWith('.')){
      const f = await h.getFile();
      out.push({kind:'file', name, handle:h, parent:dir, path, size:f.size, date:f.lastModified,
        tipo:(meta.files[metaKey(sec, path, name)] || {}).tipo || ''});
    }
  }));
}
async function rescan(secId){
  const sec = SECTIONS.find(s => s.id === secId);
  const out = [];
  await scanDir(sec, secHandles[secId], [], out);
  cache[secId] = out;
}
async function rescanAll(){
  await Promise.all(SECTIONS.map(s => rescan(s.id)));
}

/* ================= INICIALIZAÇÃO ================= */
async function init(){
  if (!window.showDirectoryPicker){
    $('#app').innerHTML = `<div class="center">${IC.logo.replace('<svg','<svg class="big"')}<h2>Navegador não suportado</h2>
      <p>Este sistema grava pastas e arquivos reais no seu computador e precisa do <b>Google Chrome</b> ou do <b>Microsoft Edge</b> atualizado.</p></div>`;
    return;
  }
  startFree();                       // entra direto no sistema, sem pedir pasta
  let h = null;
  try { h = await kvGet('root'); } catch(e){}
  if (!h) return;
  root = h;
  let perm = 'prompt';
  try { perm = await h.queryPermission({mode:'readwrite'}); } catch(e){}
  if (perm === 'granted') await openRoot();
  else renderRootInfo();
}

// abre a interface vazia: o usuário navega à vontade e conecta a pasta quando quiser
function startFree(){
  connected = false;
  secHandles = {};
  meta = {version:1, types:{}, files:{}};
  for (const s of SECTIONS) if (s.typed) meta.types[s.id] = [...s.types];
  cache = {};
  for (const s of SECTIONS) cache[s.id] = [];
  cur = {sec:'word', path:[]};
  resetFilters();
  buildShell();
  render();
}

function renderRootInfo(){
  const el = $('#rootinfo');
  if (!el) return;
  if (connected){
    el.innerHTML = `Pasta do sistema: <b>${esc(root.name)}</b>
      <button class="btn sm" id="swap">${IC.swap} Trocar</button>`;
    $('#swap').onclick = pickRoot;
  } else if (root){
    el.innerHTML = `Pasta <b>${esc(root.name)}</b> aguardando autorização
      <button class="btn sm primary" id="conn">Autorizar acesso</button>
      <button class="btn sm" id="swap">${IC.swap} Trocar</button>`;
    $('#conn').onclick = ensureRoot;
    $('#swap').onclick = pickRoot;
  } else {
    el.innerHTML = `Nenhuma pasta conectada
      <button class="btn sm primary" id="conn">Conectar pasta</button>`;
    $('#conn').onclick = ensureRoot;
  }
}

// chamado só quando a ação precisa mesmo mexer nos arquivos
async function ensureRoot(){
  if (connected) return true;
  if (root){
    try {
      const p = await root.requestPermission({mode:'readwrite'});
      if (p === 'granted'){ await openRoot(); return connected; }
      toast('Acesso não autorizado.', 'err');
    } catch(e){ toast('Não foi possível acessar a pasta.', 'err'); }
    return false;
  }
  return await pickRoot();
}
async function pickRoot(){
  try {
    const h = await window.showDirectoryPicker({id:'organizador', mode:'readwrite'});
    root = h;
    await kvSet('root', h);
    await openRoot();
    return connected;
  } catch(e){
    if (e.name !== 'AbortError') toast('Não foi possível usar essa pasta. Tente outra (por exemplo uma pasta nova).', 'err');
    return false;
  }
}
async function openRoot(){
  busy(true, 'Abrindo pasta...');
  try {
    for (const s of SECTIONS) secHandles[s.id] = await root.getDirectoryHandle(s.dir, {create:true});
    connected = true;
    meta = {version:1, types:{}, files:{}};
    try {
      const fh = await root.getFileHandle(META_FILE);
      const saved = JSON.parse(await (await fh.getFile()).text());
      meta.types = saved.types || {}; meta.files = saved.files || {};
    } catch(e){}
    for (const s of SECTIONS) if (s.typed && !meta.types[s.id]) meta.types[s.id] = [...s.types];
    await saveMeta();
    await rescanAll();
    cur = {sec:cur.sec, path:[]};
    resetFilters();
    buildShell();
    render();
    toast('Pasta conectada: ' + root.name, 'ok');
  } catch(e){
    console.error(e);
    connected = false;
    toast('Erro ao abrir a pasta: ' + e.message, 'err');
    startFree();
  } finally { busy(false); }
}

/* ================= INTERFACE ================= */
function buildShell(){
  $('#app').innerHTML = `
  <header>
    <div class="brand">${IC.logo}<h1>Organizador de Arquivos</h1></div>
    <div class="rootinfo" id="rootinfo"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="toolbar">
    <div class="crumbs" id="crumbs"></div>
    <div class="actions" id="actions"></div>
  </div>
  <div class="filters" id="filters">
    <label class="wide">Nome<input id="fq" type="search" placeholder="Digite parte do nome..." autocomplete="off"></label>
    <label id="ftWrap">Tipo<select id="ft"></select></label>
    <label>Data de<input id="ff" type="date"></label>
    <label>Data até<input id="fu" type="date"></label>
    <button class="btn" id="fclear">Limpar</button>
  </div>
  <div class="content" id="content">
    <div class="dropmsg">Solte os arquivos aqui para enviar</div>
    <div id="list"></div>
  </div>`;
  renderRootInfo();

  let tm;
  $('#fq').oninput = e => { clearTimeout(tm); tm = setTimeout(() => { filt.q = e.target.value.trim(); render(); }, 120); };
  $('#ft').onchange = e => { filt.tipo = e.target.value; render(); };
  $('#ff').onchange = e => { filt.from = e.target.value; render(); };
  $('#fu').onchange = e => { filt.to = e.target.value; render(); };
  $('#fclear').onclick = () => { resetFilters(); syncFilterInputs(); render(); };

  const c = $('#content');
  let depth = 0;
  c.addEventListener('dragenter', e => { if (hasFiles(e)){ e.preventDefault(); depth++; c.classList.add('drag'); } });
  c.addEventListener('dragover',  e => { if (hasFiles(e)) e.preventDefault(); });
  c.addEventListener('dragleave', e => { if (hasFiles(e)){ depth--; if (depth <= 0){ depth = 0; c.classList.remove('drag'); } } });
  c.addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; c.classList.remove('drag');
    const ps = [...e.dataTransfer.items].filter(i => i.kind === 'file')
      .map(i => i.getAsFileSystemHandle ? i.getAsFileSystemHandle() : Promise.resolve(null));
    handleDrop(ps, [...e.dataTransfer.files]);
  });
  $('#list').addEventListener('click', onListClick);
}
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');

function resetFilters(){ filt.q = ''; filt.tipo = ''; filt.from = ''; filt.to = ''; }
function syncFilterInputs(){
  $('#fq').value = filt.q; $('#ff').value = filt.from; $('#fu').value = filt.to;
  fillTypeFilter();
}
function fillTypeFilter(){
  const sec = S();
  $('#ftWrap').classList.toggle('hide', !sec.typed);
  if (!sec.typed) return;
  const types = meta.types[sec.id] || [];
  $('#ft').innerHTML = `<option value="">Todos</option>` + types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  $('#ft').value = types.includes(filt.tipo) ? filt.tipo : '';
  if ($('#ft').value !== filt.tipo) filt.tipo = '';
}

function renderTabs(){
  $('#tabs').innerHTML = SECTIONS.map(s => {
    const n = (cache[s.id] || []).filter(i => i.kind === 'file').length;
    return `<button class="tab ${s.id === cur.sec ? 'active' : ''}" data-sec="${s.id}">
      <span class="dot" style="background:${s.color}"></span>${s.label}<span class="count">${n.toLocaleString('pt-BR')}</span></button>`;
  }).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    cur = {sec:b.dataset.sec, path:[]};
    resetFilters(); syncFilterInputs(); render();
  });
}

function isSearching(){ return !!(filt.q || filt.tipo || filt.from || filt.to); }

function getVisible(){
  const sec = S(), all = cache[sec.id] || [];
  const q = filt.q.toLowerCase();
  const from = filt.from ? new Date(filt.from + 'T00:00:00').getTime() : null;
  const to = filt.to ? new Date(filt.to + 'T23:59:59.999').getTime() : null;
  let items;
  if (!isSearching()){
    items = all.filter(i => samePath(i.path, cur.path));
  } else {
    items = all.filter(i => {
      if (i.kind === 'dir') return q && !filt.tipo && from === null && to === null && i.name.toLowerCase().includes(q);
      if (q && !i.name.toLowerCase().includes(q)) return false;
      if (filt.tipo && i.tipo !== filt.tipo) return false;
      if (from !== null && i.date < from) return false;
      if (to !== null && i.date > to) return false;
      return true;
    });
  }
  const dirMul = filt.dir === 'asc' ? 1 : -1;
  const cmpName = (a, b) => a.name.localeCompare(b.name, 'pt-BR', {numeric:true, sensitivity:'base'});
  items.sort((a, b) => {
    if (a.kind !== b.kind) return a.kind === 'dir' ? -1 : 1;
    if (a.kind === 'dir') return cmpName(a, b);
    let r = 0;
    if (filt.sort === 'name') r = cmpName(a, b);
    else if (filt.sort === 'date') r = a.date - b.date;
    else if (filt.sort === 'tipo') r = (a.tipo || '').localeCompare(b.tipo || '', 'pt-BR') || cmpName(a, b);
    else if (filt.sort === 'size') r = a.size - b.size;
    return r * dirMul || cmpName(a, b);
  });
  return items;
}

function render(){
  renderTabs();
  fillTypeFilter();
  const sec = S();
  view = getVisible();

  // breadcrumb
  const parts = [{label:sec.label, path:[]}];
  cur.path.forEach((p, i) => parts.push({label:p, path:cur.path.slice(0, i+1)}));
  if (isSearching()){
    const nf = view.filter(v => v.kind === 'file').length;
    $('#crumbs').innerHTML = `<span class="res">Resultados da busca em <b style="color:var(--text)">${esc(sec.label)}</b>: <b>${nf.toLocaleString('pt-BR')}</b> arquivo${nf === 1 ? '' : 's'}</span>`;
  } else {
    $('#crumbs').innerHTML = parts.map((p, i) => {
      const last = i === parts.length - 1;
      return (i ? '<span class="sep">›</span>' : '') + `<button class="${last ? 'last' : ''}" data-go="${i}">${esc(p.label)}</button>`;
    }).join('');
    document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
      const i = +b.dataset.go; cur.path = parts[i].path; render();
    });
  }

  // ações
  $('#actions').innerHTML =
    `<button class="btn" id="aFolder">${IC.plus} Nova pasta</button>` +
    (sec.typed ? `<button class="btn" id="aTypes">${IC.tag} Tipos</button>` : '') +
    (!sec.typed ? `<button class="btn" id="aDirUp">${IC.upload} Enviar pasta</button>` : '') +
    `<button class="btn primary" id="aUp">${IC.upload} Enviar arquivos</button>`;
  $('#aFolder').onclick = newFolder;
  if (sec.typed) $('#aTypes').onclick = manageTypes;
  if (!sec.typed) $('#aDirUp').onclick = pickFolderToUpload;
  $('#aUp').onclick = pickFiles;

  renderList();
}

function renderList(){
  const sec = S();
  if (!connected){
    $('#list').innerHTML = `<div class="empty">${IC.empty}
      <p style="font-size:17px;color:var(--text)">Você está navegando no sistema</p>
      <p>Explore as abas e os filtros à vontade. Quando quiser adicionar arquivos, conecte uma pasta do seu computador — o sistema cria sozinho as subpastas <b>Word</b>, <b>PowerPoint</b>, <b>Excel</b> e <b>Download</b>.</p>
      <button class="btn primary" id="connBig" style="margin-top:14px">Conectar pasta e adicionar arquivos</button></div>`;
    $('#connBig').onclick = ensureRoot;
    return;
  }
  if (!view.length){
    $('#list').innerHTML = `<div class="empty">${IC.empty}<p style="font-size:17px;color:var(--text)">${isSearching() ? 'Nenhum resultado encontrado' : 'Esta pasta está vazia'}</p>
      <p>${isSearching() ? 'Ajuste ou limpe os filtros.' : 'Arraste arquivos para cá ou use o botão <b>Enviar arquivos</b>.'}</p></div>`;
    return;
  }
  const all = cache[sec.id] || [];
  const searching = isSearching();
  const arrow = k => filt.sort === k ? `<span class="arr">${filt.dir === 'asc' ? '▲' : '▼'}</span>` : '';
  const rows = view.map((it, idx) => {
    const loc = searching ? `<div class="loc">${esc([sec.dir, ...it.path].join(' / '))}</div>` : '';
    if (it.kind === 'dir'){
      const full = [...it.path, it.name];
      const n = all.filter(x => samePath(x.path, full)).length;
      return `<tr>
        <td><div class="name folderlink" data-act="enter" data-i="${idx}"><div class="ico folder">${IC.folder}</div>
          <div class="t"><div class="n">${esc(it.name)}</div>${loc}</div></div></td>
        <td class="col-tipo dim">Pasta</td>
        <td class="dim">—</td>
        <td class="col-size"><span class="gold">${n.toLocaleString('pt-BR')}</span> <span class="dim">${n === 1 ? 'item' : 'itens'}</span></td>
        <td><div class="rowact">
          <button class="iconbtn del" title="Excluir pasta" data-act="del" data-i="${idx}">${IC.trash}</button></div></td></tr>`;
    }
    return `<tr>
      <td><div class="name">${fileIcon(it.name, sec)}<div class="t"><div class="n">${esc(it.name)}</div>${loc}</div></div></td>
      <td class="col-tipo">${sec.typed ? (it.tipo ? `<span class="badge">${esc(it.tipo)}</span>` : '<span class="dim">—</span>') : '<span class="dim">' + esc(extOf(it.name).replace('.','').toUpperCase() || '—') + '</span>'}</td>
      <td class="gold">${fmtDate(it.date)}</td>
      <td class="col-size gold">${fmtSize(it.size)}</td>
      <td><div class="rowact">
        <button class="iconbtn" title="Abrir / baixar" data-act="open" data-i="${idx}">${IC.open}</button>
        ${sec.typed ? `<button class="iconbtn" title="Alterar tipo" data-act="tipo" data-i="${idx}">${IC.tag}</button>` : ''}
        <button class="iconbtn del" title="Excluir" data-act="del" data-i="${idx}">${IC.trash}</button></div></td></tr>`;
  }).join('');
  $('#list').innerHTML = `<table><thead><tr>
    <th class="sortable" data-sort="name">Nome ${arrow('name')}</th>
    <th class="sortable col-tipo" data-sort="${sec.typed ? 'tipo' : 'name'}">${sec.typed ? 'Tipo ' + arrow('tipo') : 'Formato'}</th>
    <th class="sortable" data-sort="date">Data ${arrow('date')}</th>
    <th class="sortable col-size" data-sort="size">Tamanho ${arrow('size')}</th>
    <th></th></tr></thead><tbody>${rows}</tbody></table>`;
  document.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    if (filt.sort === k) filt.dir = filt.dir === 'asc' ? 'desc' : 'asc';
    else { filt.sort = k; filt.dir = k === 'date' || k === 'size' ? 'desc' : 'asc'; }
    render();
  });
}

function onListClick(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const it = view[+el.dataset.i];
  if (!it) return;
  const act = el.dataset.act;
  if (act === 'enter'){ cur.path = [...it.path, it.name]; resetFilters(); syncFilterInputs(); render(); }
  else if (act === 'open') openItem(it);
  else if (act === 'tipo') editType(it);
  else if (act === 'del') deleteItem(it);
}

/* ================= MODAL ================= */
function openModal(title, bodyHtml, buttons){
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" role="dialog"><h3>${esc(title)}</h3><div class="body">${bodyHtml}</div><div class="foot"></div></div>`;
  const foot = $('.foot', ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls || ''); btn.textContent = b.label;
    btn.onclick = () => b.fn ? b.fn(close, ov) : close();
    foot.appendChild(btn);
  });
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  document.body.appendChild(ov);
  const first = $('input,select', ov); if (first) first.focus();
  return {ov, close};
}

/* ================= AÇÕES ================= */
async function refreshSec(){
  if (!connected) return render();
  await rescan(cur.sec);
  // se a pasta atual deixou de existir, volta para a raiz da aba
  const all = cache[cur.sec];
  for (let i = 1; i <= cur.path.length; i++){
    const p = cur.path.slice(0, i);
    if (!all.some(x => x.kind === 'dir' && samePath(x.path, p.slice(0,-1)) && x.name === p[p.length-1])){ cur.path = p.slice(0,-1); break; }
  }
  render();
}

async function newFolder(){
  if (!await ensureRoot()) return;
  const {ov, close} = openModal('Nova pasta',
    `<label class="f" style="margin-top:0">Nome da pasta</label><input id="nfName" type="text" maxlength="100" placeholder="Ex.: Políticas 2026" autocomplete="off">`,
    [{label:'Cancelar'}, {label:'Criar pasta', cls:'primary', fn: async (close, ov) => {
      const name = cleanName($('#nfName', ov).value);
      if (!name) return toast('Digite um nome válido.', 'err');
      try {
        const dir = await getDir(cur.sec, cur.path);
        if (await exists(dir, name)) return toast('Já existe um item com esse nome.', 'err');
        await dir.getDirectoryHandle(name, {create:true});
        close(); await refreshSec(); toast('Pasta criada.', 'ok');
      } catch(e){ toast('Erro ao criar pasta: ' + e.message, 'err'); }
    }}]);
  $('#nfName', ov).addEventListener('keydown', e => { if (e.key === 'Enter') $('.btn.primary', ov).click(); });
}

function deleteItem(it){
  const isDir = it.kind === 'dir';
  let extra = '';
  if (isDir){
    const full = [...it.path, it.name];
    const n = (cache[cur.sec] || []).filter(x => x.kind === 'file' && x.path.length >= full.length && full.every((p, i) => x.path[i] === p)).length;
    extra = n ? ` Ela contém <b class="gold">${n.toLocaleString('pt-BR')}</b> arquivo${n === 1 ? '' : 's'} que também ser${n === 1 ? 'á' : 'ão'} excluído${n === 1 ? '' : 's'}.` : '';
  }
  openModal(isDir ? 'Excluir pasta' : 'Excluir arquivo',
    `<p>Excluir <b style="color:var(--text)">${esc(it.name)}</b>?${extra} Esta ação não pode ser desfeita.</p>`,
    [{label:'Cancelar'}, {label:'Excluir', cls:'danger', fn: async close => {
      try {
        await it.parent.removeEntry(it.name, {recursive:true});
        const sec = S(), prefix = metaKey(sec, it.path, it.name);
        for (const k of Object.keys(meta.files)) if (k === prefix || k.startsWith(prefix + '/')) delete meta.files[k];
        await saveMeta();
        close(); await refreshSec(); toast('Excluído.', 'ok');
      } catch(e){ toast('Erro ao excluir: ' + e.message, 'err'); }
    }}]);
}

async function openItem(it){
  try {
    const f = await it.handle.getFile();
    const url = URL.createObjectURL(f);
    if (/\.(pdf|png|jpe?g|gif|webp|svg|txt)$/i.test(it.name)) window.open(url, '_blank');
    else { const a = document.createElement('a'); a.href = url; a.download = it.name; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch(e){ toast('Não foi possível abrir o arquivo.', 'err'); }
}

function typeOptions(types, selected){
  return `<option value="">— sem tipo —</option>` + types.map(t => `<option value="${esc(t)}" ${t === selected ? 'selected' : ''}>${esc(t)}</option>`).join('');
}

function editType(it){
  const sec = S(), types = meta.types[sec.id] || [];
  openModal('Alterar tipo',
    `<p>${esc(it.name)}</p><label class="f" style="margin-top:0">Tipo</label><select id="etSel">${typeOptions(types, it.tipo)}</select>`,
    [{label:'Cancelar'}, {label:'Salvar', cls:'primary', fn: async (close, ov) => {
      const v = $('#etSel', ov).value;
      const k = metaKey(sec, it.path, it.name);
      if (v) meta.files[k] = {tipo:v}; else delete meta.files[k];
      it.tipo = v;
      await saveMeta(); close(); render(); toast('Tipo atualizado.', 'ok');
    }}]);
}

function manageTypes(){
  const sec = S();
  const draw = ov => {
    const types = meta.types[sec.id] || [];
    $('#tmList', ov).innerHTML = types.length
      ? types.map((t, i) => `<span class="chip">${esc(t)}<button data-rm="${i}" title="Remover">×</button></span>`).join('')
      : '<span class="dim">Nenhum tipo cadastrado.</span>';
    ov.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
      meta.types[sec.id].splice(+b.dataset.rm, 1);
      await saveMeta(); draw(ov); fillTypeFilter();
    });
  };
  const {ov} = openModal('Tipos de ' + sec.dir,
    `<p>Os tipos servem para classificar e filtrar os arquivos desta aba. Remover um tipo não apaga os arquivos.</p>
     <div class="typelist" id="tmList"></div>
     <label class="f">Novo tipo</label>
     <div class="inline"><input id="tmNew" type="text" maxlength="30" placeholder="Ex.: MAN" autocomplete="off"><button class="btn primary" id="tmAdd">Adicionar</button></div>`,
    [{label:'Fechar', cls:'primary', fn: close => { close(); render(); }}]);
  draw(ov);
  const add = async () => {
    const v = $('#tmNew', ov).value.trim();
    if (!v) return;
    const list = meta.types[sec.id] || (meta.types[sec.id] = []);
    if (list.some(t => t.toLowerCase() === v.toLowerCase())) return toast('Esse tipo já existe.', 'err');
    list.push(v); await saveMeta(); $('#tmNew', ov).value = ''; draw(ov); fillTypeFilter();
  };
  $('#tmAdd', ov).onclick = add;
  $('#tmNew', ov).addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
}

/* ================= ENVIO ================= */
async function pickFiles(){
  if (!connected){
    await ensureRoot();
    if (connected) toast('Pasta conectada. Clique em Enviar arquivos novamente.', 'ok');
    return;
  }
  const sec = S();
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  if (sec.exts) inp.accept = sec.exts.join(',');
  inp.onchange = () => { if (inp.files.length) startUpload([...inp.files]); };
  inp.click();
}
async function pickFolderToUpload(){
  if (!connected){
    await ensureRoot();
    if (connected) toast('Pasta conectada. Clique em Enviar pasta novamente.', 'ok');
    return;
  }
  try {
    const h = await window.showDirectoryPicker({id:'organizador-envio'});
    busy(true, 'Copiando pasta...');
    const dir = await getDir(cur.sec, cur.path);
    const nd = await dir.getDirectoryHandle(await uniqueName(dir, h.name), {create:true});
    await copyDir(h, nd);
    await refreshSec(); await rescanAll(); renderTabs();
    toast('Pasta enviada.', 'ok');
  } catch(e){ if (e.name !== 'AbortError') toast('Erro ao enviar pasta: ' + e.message, 'err'); }
  finally { busy(false); }
}
async function handleDrop(ps, fallback){
  if (!connected){
    await ensureRoot();
    if (connected) toast('Pasta conectada. Arraste os arquivos novamente.', 'ok');
    return;
  }
  const sec = S();
  let handles = (await Promise.all(ps)).filter(Boolean);
  if (!handles.length && fallback.length) handles = fallback.map(f => ({kind:'file', getFile: async () => f, name:f.name}));
  const files = [], dirs = [];
  for (const h of handles){ if (h.kind === 'file') files.push(await h.getFile()); else dirs.push(h); }
  if (!sec.typed){
    busy(true, 'Enviando...');
    try {
      const dir = await getDir(cur.sec, cur.path);
      for (const f of files) await saveFile(dir, f);
      for (const d of dirs){
        const nd = await dir.getDirectoryHandle(await uniqueName(dir, d.name), {create:true});
        await copyDir(d, nd);
      }
      await refreshSec(); await rescanAll(); renderTabs();
      toast('Envio concluído.', 'ok');
    } catch(e){ toast('Erro no envio: ' + e.message, 'err'); }
    finally { busy(false); }
  } else {
    if (dirs.length) toast('Pastas só podem ser enviadas na aba Download. Crie uma pasta aqui e envie os arquivos dentro dela.', 'err');
    if (files.length) startUpload(files);
  }
}

function guessType(name, types){
  const up = name.toUpperCase();
  const sorted = [...types].sort((a, b) => b.length - a.length);
  for (const t of sorted){
    const T = t.toUpperCase();
    if (up.startsWith(T) && (up.length === T.length || !/[A-Z0-9À-Ü]/i.test(up[T.length]))) return t;
  }
  return '';
}

function startUpload(files){
  const sec = S();
  let list = files;
  if (sec.exts){
    const bad = files.filter(f => !sec.exts.includes(extOf(f.name)));
    list = files.filter(f => sec.exts.includes(extOf(f.name)));
    if (bad.length) toast(`${bad.length} arquivo${bad.length > 1 ? 's' : ''} ignorado${bad.length > 1 ? 's' : ''} (formato não pertence a esta aba): ${bad.slice(0,3).map(f => f.name).join(', ')}${bad.length > 3 ? '...' : ''}`, 'err');
  }
  if (!list.length) return;
  if (!sec.typed) return doUpload(list.map(f => ({file:f, tipo:''})));

  const types = meta.types[sec.id] || [];
  const choice = list.map(f => guessType(f.name, types));
  const rows = list.map((f, i) => `<div class="uprow"><div><div class="fn" title="${esc(f.name)}">${esc(f.name)}</div><div class="fs">${fmtSize(f.size)}</div></div>
      <select data-up="${i}">${typeOptions(types, choice[i])}</select></div>`).join('');
  const {ov} = openModal(`Enviar ${list.length} arquivo${list.length > 1 ? 's' : ''}`,
    `<p>Escolha o tipo de cada documento. Se o nome começa com o código (ex.: <b>POL</b> - Política...), o tipo já vem preenchido.</p>
     ${list.length > 1 ? `<label class="f" style="margin-top:0">Aplicar o mesmo tipo a todos</label><select id="upAll">${typeOptions(types, '')}</select><div style="height:10px"></div>` : ''}
     <div id="upRows">${rows}</div>`,
    [{label:'Cancelar'}, {label:'Enviar', cls:'primary', fn: async close => {
      const entries = list.map((f, i) => ({file:f, tipo:$(`[data-up="${i}"]`, ov).value}));
      close(); doUpload(entries);
    }}]);
  const all = $('#upAll', ov);
  if (all) all.onchange = () => ov.querySelectorAll('[data-up]').forEach(s => s.value = all.value);
}

async function doUpload(entries){
  const sec = S();
  busy(true, 'Enviando...');
  let ok = 0;
  try {
    const dir = await getDir(cur.sec, cur.path);
    for (let i = 0; i < entries.length; i++){
      $('#busyTxt').textContent = `Enviando ${i + 1} de ${entries.length}...`;
      const name = await saveFile(dir, entries[i].file);
      if (entries[i].tipo) meta.files[metaKey(sec, cur.path, name)] = {tipo:entries[i].tipo};
      ok++;
    }
    await saveMeta();
    await refreshSec();
    toast(`${ok} arquivo${ok > 1 ? 's' : ''} enviado${ok > 1 ? 's' : ''}.`, 'ok');
  } catch(e){
    toast('Erro no envio: ' + e.message, 'err');
    if (ok){ await saveMeta().catch(()=>{}); await refreshSec(); }
  } finally { busy(false); }
}

init();
</script>
</body>
